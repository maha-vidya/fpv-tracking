name: CI

on:
  push:
  pull_request:

jobs:
  tracker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ pkg-config \
            libopencv-dev libopencv-contrib-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstrtspserver-1.0-dev

      - name: Fetch MAVLink headers (pinned)
        run: tracker/scripts/fetch_mavlink.sh

      - name: Build (warnings are errors)
        run: |
          cmake -S tracker -B tracker/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror
          cmake --build tracker/build -j"$(nproc)"

      - name: Self-test (follow logic, GO, geometry, protocol)
        run: tracker/build/target_tracker --selftest

      - name: Sidecar syntax check
        run: python3 -m py_compile tracker/*.py tracker/tests/*.py simulation/*.py

      - name: C12 protocol tests
        working-directory: simulation/c12
        run: python3 test_c12.py
